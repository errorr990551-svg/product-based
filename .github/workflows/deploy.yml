name: Hostinger Fast ZIP Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🚀 Build & Ultra-Fast Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          cd ..
          npm install --no-save basic-ftp

      - name: 🏗️ Build Site & Assets
        run: |
          cd frontend
          npm run build

      - name: 🗜️ Package into Fast Deploy ZIP (with .htaccess)
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN || 'https://iotaflow.com' }}
        run: |
          DEPLOY_SECRET=$(openssl rand -hex 16)
          ZIP_NAME="deploy_${DEPLOY_SECRET}.zip"
          echo "DEPLOY_SECRET=$DEPLOY_SECRET" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          DEPLOY_SECRET=$DEPLOY_SECRET ZIP_NAME=$ZIP_NAME node .github/scripts/package_deploy.cjs

      - name: 📤 Upload Package to Hostinger (Fast FTP)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          node .github/scripts/upload_ftp.cjs

      - name: ⚡ Trigger Server Unpack & Clean Up Archive
        run: |
          DOMAIN="${{ secrets.SITE_DOMAIN || 'https://iotaflow.com' }}"
          DOMAIN="${DOMAIN%/}"
          echo "🚀 Triggering extraction on server: ${DOMAIN}/deploy_extract.php?zip=${ZIP_NAME}..."

          # Simple HTTP GET request to trigger PHP ZipArchive extractTo
          RESPONSE=$(curl -k -s -S -L --max-time 120 \
            -H "X-Deploy-Secret: ${DEPLOY_SECRET}" \
            "${DOMAIN}/deploy_extract.php?secret=${DEPLOY_SECRET}&zip=${ZIP_NAME}")

          echo "Server Response: $RESPONSE"

          if [[ "$RESPONSE" == *"success"* ]]; then
            echo "🎉 Extraction successful! All pages and assets deployed instantly on Hostinger."
          else
            echo "❌ Extraction failed or script was not reachable."
            echo "------------------------------------------------------"
            echo "Server returned: $RESPONSE"
            echo "------------------------------------------------------"
            exit 1
          fi

      - name: 🌐 Verify Website Health
        run: |
          DOMAIN="${{ secrets.SITE_DOMAIN || 'https://iotaflow.com' }}"
          DOMAIN="${DOMAIN%/}"
          echo "🔍 Verifying homepage..."
          HTTP_STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" "${DOMAIN}/")
          echo "HTTP Status for ${DOMAIN}/: $HTTP_STATUS"

          echo "🔍 Verifying new product page: /product-detail/detail26..."
          DETAIL_STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" "${DOMAIN}/product-detail/detail26")
          echo "HTTP Status for /product-detail/detail26: $DETAIL_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Website is live and healthy!"
          else
            echo "⚠️ Homepage returned unexpected HTTP status: $HTTP_STATUS"
            exit 1
          fi

          if [ "$DETAIL_STATUS" -eq 200 ] || [ "$DETAIL_STATUS" -eq 301 ] || [ "$DETAIL_STATUS" -eq 302 ]; then
            echo "✅ Fire Pump Test Meter page is live!"
          else
            echo "⚠️ Detail26 returned HTTP status: $DETAIL_STATUS"
          fi

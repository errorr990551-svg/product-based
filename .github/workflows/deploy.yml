name: Hostinger Fast ZIP Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🚀 Build & Ultra-Fast Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci
          cd ..
          npm install --no-save basic-ftp

      - name: 🏗️ Build Site & Assets
        run: |
          cd frontend
          npm run build
          cd ..

      - name: 🗜️ Package into Fast Deploy ZIP (with .htaccess)
        run: |
          # 1. Generate unique deployment secret and archive name for this run
          DEPLOY_SECRET=$(openssl rand -hex 16)
          ZIP_NAME="deploy_${DEPLOY_SECRET}.zip"
          echo "DEPLOY_SECRET=$DEPLOY_SECRET" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          # 2. Create staging directory
          mkdir -p staging

          # 3. Zip files (excluding *.map, and excluding heavy documents/video unless modified in this commit)
          cd frontend/build
          shopt -s dotglob
          if git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null | grep -E '^frontend/public/documents/|\.mp4$'; then
            echo "📦 Documents or video modified in this commit: packaging full site including documents..."
            zip -9 -r "../../staging/${ZIP_NAME}" * -x "*.map"
          else
            echo "⚡ Core app update: excluding heavy static documents & video (already cached on server)..."
            zip -9 -r "../../staging/${ZIP_NAME}" * -x "*.map" -x "documents/*" -x "*.mp4"
          fi
          cd ../..

          # 4. Copy extraction script and inject secret token
          cp .github/scripts/deploy_extract.php staging/deploy_extract.php
          sed -i "s/DEPLOY_SECRET_KEY/$DEPLOY_SECRET/g" staging/deploy_extract.php

          echo "✅ Deployment package prepared in staging/:"
          ls -lh staging/

      - name: 📤 Upload Extractor Script to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          node .github/scripts/upload_ftp.cjs --only-extractor

      - name: ⚡ High-Speed HTTPS Deploy & Server Unpack
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          DOMAIN="${{ secrets.SITE_DOMAIN || 'https://iotaflow.com' }}"
          DOMAIN="${DOMAIN%/}"
          ZIP_FILE="staging/${ZIP_NAME}"
          echo "🌐 Uploading & extracting ${ZIP_NAME} via HTTPS stream to ${DOMAIN}..."

          RESPONSE=$(curl -k -s -S -L --max-time 300 \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${ZIP_FILE}" \
            "${DOMAIN}/deploy_extract.php?secret=${DEPLOY_SECRET}&zip=${ZIP_NAME}")
          echo "Server Response: $RESPONSE"

          # If response doesn't contain success, also try alternate domain format (with/without www)
          if [[ "$RESPONSE" != *"success"* ]]; then
            if [[ "$DOMAIN" == *"https://www."* ]]; then
              ALT_DOMAIN="${DOMAIN/https:\/\/www./https:\/\/}"
            else
              ALT_DOMAIN="${DOMAIN/https:\/\//https:\/\/www.}"
            fi
            echo "Retrying on alternate domain: ${ALT_DOMAIN}/deploy_extract.php..."
            ALT_RESPONSE=$(curl -k -s -S -L --max-time 300 \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${ZIP_FILE}" \
              "${ALT_DOMAIN}/deploy_extract.php?secret=${DEPLOY_SECRET}&zip=${ZIP_NAME}")
            echo "Alternate Response: $ALT_RESPONSE"
            if [[ "$ALT_RESPONSE" == *"success"* ]]; then
              RESPONSE="$ALT_RESPONSE"
            fi
          fi

          # Fallback to FTP upload if direct HTTPS upload was not accepted
          if [[ "$RESPONSE" != *"success"* ]]; then
            echo "⚠️ Direct HTTPS stream upload did not complete, falling back to FTP upload..."
            node .github/scripts/upload_ftp.cjs
            echo "Triggering extraction on server..."
            FALLBACK_RESPONSE=$(curl -k -s -S -L --max-time 120 "${DOMAIN}/deploy_extract.php?secret=${DEPLOY_SECRET}&zip=${ZIP_NAME}")
            echo "Fallback Response: $FALLBACK_RESPONSE"
            if [[ "$FALLBACK_RESPONSE" == *"success"* ]]; then
              RESPONSE="$FALLBACK_RESPONSE"
            fi
          fi

          if [[ "$RESPONSE" == *"success"* ]]; then
            echo "🎉 Extraction successful! All pages and assets deployed instantly on Hostinger."
          else
            echo "❌ Extraction failed or script was not reachable."
            echo "------------------------------------------------------"
            echo "Server returned: $RESPONSE"
            echo "------------------------------------------------------"
            exit 1
          fi

      - name: 🌐 Verify Website Health
        run: |
          DOMAIN="${{ secrets.SITE_DOMAIN || 'https://iotaflow.com' }}"
          DOMAIN="${DOMAIN%/}"
          HTTP_STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" "${DOMAIN}/")
          echo "HTTP Status for ${DOMAIN}/: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Website is live and healthy!"
          else
            echo "⚠️ Website returned HTTP $HTTP_STATUS"
          fi

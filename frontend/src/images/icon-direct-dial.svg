<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <rect width="48" height="48" rx="8" fill="#E3F2FD"/>
  <!-- Dial circular meter -->
  <circle cx="24" cy="24" r="17" stroke="#1565C0" stroke-width="2.5" fill="#FFFFFF"/>
  <circle cx="24" cy="24" r="14" stroke="#90CAF9" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- Tick marks -->
  <line x1="24" y1="9" x2="24" y2="13" stroke="#1565C0" stroke-width="2"/>
  <line x1="13" y1="20" x2="16.5" y2="22" stroke="#1565C0" stroke-width="2"/>
  <line x1="35" y1="20" x2="31.5" y2="22" stroke="#1565C0" stroke-width="2"/>
  <line x1="16" y1="30" x2="19" y2="28" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="32" y1="30" x2="29" y2="28" stroke="#1565C0" stroke-width="1.5"/>
  <!-- Gauge needle pointing at top-right -->
  <line x1="24" y1="24" x2="31" y2="15" stroke="#D32F2F" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="3.5" fill="#1565C0"/>
  <circle cx="24" cy="24" r="1.5" fill="#FFFFFF"/>
</svg>

